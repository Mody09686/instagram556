<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141c">
  <title>معاينة الكاميرا</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 18px;
      display: grid; place-items: center;
      font-family: system-ui, Arial, sans-serif;
      background: #10141c; color: #f7f8fa;
    }
    main {
      width: min(100%, 480px); padding: 24px;
      border: 1px solid #303846; border-radius: 22px;
      background: #19212d; text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 1.6rem; }
    p { color: #c6cfda; line-height: 1.7; }
    video {
      display: block; width: 100%; min-height: 220px; max-height: 60vh;
      margin: 18px auto; border-radius: 16px; background: #0b0e13;
      object-fit: cover; transform: scaleX(-1);
    }
    button {
      border: 0; border-radius: 12px; padding: 13px 20px;
      margin: 6px; font-size: 1rem; font-weight: 650; cursor: pointer;
    }
    #start { background: #21b7a3; color: #071713; }
    #stop { background: #394454; color: white; }
    #status { min-height: 1.6em; font-size: .95rem; }
    .privacy { font-size: .88rem; color: #aeb9c7; }
  </style>
</head>
<body>
<main>
  <h1>معاينة الكاميرا الأمامية</h1>
  <p>اضغط تشغيل إذا كنت ترغب في عرض صورة الكاميرا الأمامية على هذا الجهاز.</p>
  <video id="preview" autoplay playsinline muted></video>
  <div>
    <button id="start" type="button">تشغيل الكاميرا</button>
    <button id="stop" type="button">إيقاف الكاميرا</button>
  </div>
  <p id="status" role="status" aria-live="polite">الكاميرا متوقفة</p>
  <p class="privacy">الخصوصية: المعاينة محلية على جهازك فقط. لا يتم تسجيل أو حفظ أو إرسال الصور أو الصوت. لا نطلب إذن الميكروفون.</p>
</main>
<script>
  const video = document.getElementById('preview');
  const status = document.getElementById('status');
  let cameraStream = null;

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status.textContent = 'المتصفح لا يدعم الكاميرا هنا. افتح الصفحة عبر HTTPS.';
      return;
    }
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'user' } },
        audio: false
      });
      video.srcObject = cameraStream;
      status.textContent = 'الكاميرا تعمل. اضغط إيقاف عند الانتهاء.';
    } catch (error) {
      status.textContent = error.name === 'NotAllowedError'
        ? 'لم يتم السماح باستخدام الكاميرا.'
        : 'تعذر تشغيل الكاميرا. تحقق من إعدادات الجهاز والمتصفح.';
    }
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
    video.srcObject = null;
    status.textContent = 'الكاميرا متوقفة';
  }

  document.getElementById('start').addEventListener('click', startCamera);
  document.getElementById('stop').addEventListener('click', stopCamera);
  window.addEventListener('pagehide', stopCamera);
</script>
</body>
</html>
