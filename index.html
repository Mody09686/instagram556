
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Permission</title>
<style>
body {
  margin: 0;
  background: #fafafa;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.box {
  text-align: center;
  padding: 25px;
}
button {
  background: #2878e8;
  color: white;
  border: 0;
  padding: 12px 35px;
  border-radius: 8px;
  font-size: 17px;
}
#message {
  display: none;
  color: #222;
  margin-top: 20px;
}
</style>
</head>
<body>

<div class="box">
  <button id="allow">سماح</button>
  <div id="message">已授予摄像头权限</div>
</div>

<script>
document.getElementById("allow").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    stream.getTracks().forEach(track => track.stop());

    document.getElementById("allow").style.display = "none";
    document.getElementById("message").style.display = "block";

  } catch (error) {
    alert("Permission denied");
  }
};
</script>

</body>
</html>
